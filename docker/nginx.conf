# Katbook VIP console — nginx serving the SPA + same-origin API proxy.
#
# The browser only ever talks to THIS origin. Requests to /api/*, /health, /ready
# are reverse-proxied to the `api` service UNCHANGED (no path rewrite). Using a
# variable upstream + the Docker embedded resolver (127.0.0.11) makes DNS LAZY:
# nginx starts even if `api` isn't up yet and re-resolves per request, so there is
# no static upstream / start-order coupling.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS; short TTL so a restarted api is picked up quickly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # large multipart video uploads pass through to /api/v1/videos/upload
    client_max_body_size 8g;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API proxy (passed through UNCHANGED, lazy DNS) ---------------------
    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # stream large uploads
    }

    location = /health {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
    }
}
