<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katbook VIP — Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▦</span> Katbook <b>VIP</b> Console
      <span class="muted">v3</span>
    </div>
    <div class="conn">
      <label>API <input id="cfg-base" type="text" placeholder="http://localhost:8000" size="22" /></label>
      <label>Key <input id="cfg-key" type="password" placeholder="X-API-Key (optional)" size="16" /></label>
      <button id="cfg-save" class="btn">Connect</button>
      <span id="health" class="dot" title="unknown"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="videos">Videos</button>
    <button class="tab" data-tab="search">Search</button>
    <button class="tab" data-tab="enqueue">Enqueue</button>
    <button class="tab" data-tab="jobs">Jobs</button>
  </nav>

  <main>
    <!-- ------------------------------------------------------ VIDEOS -->
    <section id="tab-videos" class="panel active">
      <div class="filters">
        <input id="f-subject" placeholder="subject" />
        <input id="f-grade" placeholder="grade_level" />
        <input id="f-language" placeholder="language" />
        <select id="f-speech">
          <option value="">has_speech: any</option>
          <option value="true">voice</option>
          <option value="false">silent</option>
        </select>
        <select id="f-status">
          <option value="">status: any</option>
          <option>queued</option><option>processing</option>
          <option>done</option><option>failed</option><option>soft_deleted</option>
        </select>
        <button id="v-load" class="btn">Load</button>
        <span id="v-count" class="muted"></span>
      </div>
      <div class="table-wrap">
        <table id="v-table">
          <thead><tr>
            <th>Source</th><th>Status</th><th>Path</th><th>Lang</th>
            <th>Dur</th><th>Segs</th><th>Dup</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="v-prev" class="btn ghost">‹ Prev</button>
        <span id="v-page" class="muted">page 1</span>
        <button id="v-next" class="btn ghost">Next ›</button>
      </div>
    </section>

    <!-- ------------------------------------------------------ SEARCH -->
    <section id="tab-search" class="panel">
      <div class="filters">
        <input id="s-q" placeholder="search segments by meaning or keyword…" style="flex:1" />
        <select id="s-mode">
          <option value="semantic">semantic</option>
          <option value="keyword">keyword</option>
          <option value="hybrid">hybrid</option>
        </select>
        <input id="s-limit" type="number" value="10" min="1" max="100" style="width:70px" />
        <button id="s-go" class="btn">Search</button>
      </div>
      <div id="s-meta" class="muted"></div>
      <div id="s-results" class="cards"></div>
    </section>

    <!-- ----------------------------------------------------- ENQUEUE -->
    <section id="tab-enqueue" class="panel">
      <div class="grid2">
        <div class="card">
          <h3>Register a server path</h3>
          <input id="e-path" placeholder="/data/inbox/lesson.mp4" />
          <label class="chk"><input type="checkbox" id="e-force" /> force reprocess</label>
          <button id="e-register" class="btn">Register</button>
        </div>
        <div class="card">
          <h3>Upload a file</h3>
          <input id="e-file" type="file" accept="video/*" />
          <button id="e-upload" class="btn">Upload &amp; register</button>
        </div>
        <div class="card">
          <h3>Enqueue a folder / glob</h3>
          <input id="e-folder" placeholder="/data/inbox   (folder)" />
          <input id="e-glob" placeholder="/data/inbox/**/*.mp4   (glob)" />
          <button id="e-batch" class="btn">Enqueue batch</button>
        </div>
      </div>
      <pre id="e-out" class="out"></pre>
    </section>

    <!-- -------------------------------------------------------- JOBS -->
    <section id="tab-jobs" class="panel">
      <div class="filters">
        <input id="j-id" placeholder="job_id (uuid)" style="flex:1" />
        <button id="j-watch" class="btn">Watch</button>
        <button id="j-stop" class="btn ghost">Stop</button>
      </div>
      <div id="j-status" class="jobcard muted">Enter a job id and press Watch.</div>
      <pre id="j-timings" class="out"></pre>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- detail drawer -->
  <div id="drawer" class="drawer">
    <div class="drawer-inner">
      <button id="drawer-close" class="btn ghost close">✕</button>
      <div id="drawer-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
